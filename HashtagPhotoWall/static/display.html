<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Wall – Display</title>
<style>
  :root { --accent: #ffcf3f; --accent2: #ff5fa2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  body.idle { cursor: none; }

  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .slide.show { opacity: 1; }
  .slide .bg { position: absolute; inset: -60px; background-size: cover; background-position: center;
    filter: blur(40px) brightness(.45) saturate(1.3); }
  .slide img { position: absolute; inset: 4vh 4vw 15vh; width: calc(100% - 8vw); height: calc(100% - 19vh);
    object-fit: contain; border-radius: 14px; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
  .slide.show img { animation: drift var(--dur, 7s) ease-out forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.04); } }
  body.no-banner .slide img { inset: 4vh 4vw; height: calc(100% - 8vh); }

  .caption { position: absolute; left: 50%; bottom: 16vh; transform: translateX(-50%); max-width: 70vw;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); padding: 1.1vh 1.6vw; border-radius: 12px;
    font-size: 2.2vh; line-height: 1.35; text-align: center; opacity: 0; transition: opacity .8s ease .6s;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .slide.show .caption:not(:empty) { opacity: 1; }
  .caption b { color: var(--accent); }
  body.no-banner .caption { bottom: 6vh; }

  .banner { position: fixed; left: 0; right: 0; bottom: 0; height: 12vh; display: flex; align-items: center;
    justify-content: space-between; padding: 0 4vw; z-index: 5;
    background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,.25)); }
  body.no-banner .banner { display: none; }
  .banner .title { font-size: 4.4vh; font-weight: 800; letter-spacing: .02em; }
  .banner .cta { font-size: 2.6vh; opacity: .9; text-align: right; }
  .banner .tag { display: inline-block; margin-left: .5em; font-size: 4.4vh; font-weight: 900;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; vertical-align: middle; }
  .counter { position: fixed; top: 2.5vh; right: 2.5vw; font-size: 1.6vh; opacity: .45; z-index: 5; }

  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 3vh;
    background: radial-gradient(circle at 30% 30%, #3a1c71, #1a1035 45%, #050510); }
  .empty h1 { font-size: 7vh; font-weight: 900; }
  .empty p { font-size: 3vh; opacity: .85; }
  .empty .big { font-size: 10vh; font-weight: 900; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty .cam { font-size: 12vh; animation: bob 2.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2vh); } }

  .fs-btn { position: fixed; top: 2vh; left: 2vw; z-index: 10; padding: 10px 16px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 15px; cursor: pointer; transition: opacity .3s; }
  body.idle .fs-btn { opacity: 0; pointer-events: none; }
</style>
</head>
<body class="idle">
  <div id="stage"></div>
  <div class="empty" id="empty">
    <div class="cam">📸</div>
    <h1 id="emptyTitle">Youth Night</h1>
    <p>Post your photos on Instagram with</p>
    <div class="big" id="emptyTag">#youthnight</div>
    <p>and watch for them up here!</p>
  </div>
  <div class="banner" id="banner">
    <div class="title" id="title">Youth Night</div>
    <div class="cta">Post your pics with <span class="tag" id="tag">#youthnight</span></div>
  </div>
  <div class="counter" id="counter"></div>
  <button class="fs-btn" id="fsBtn">⛶ Full screen (F)</button>

<script>
let settings = { title: "Youth Night", hashtag: "#youthnight", interval: 7, showCaptions: true, showBanner: true, newestFirst: true };
let photos = [];          // all photos from the folder, in the order added
let version = "";
let index = -1;           // index of the photo on screen
let priority = [];        // newly added photos to show next
let timer = null;
let current = null;       // current slide element
const preloaded = new Map();

const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function preload(p) {
  if (!p || preloaded.has(p.name)) return preloaded.get(p && p.name);
  const img = new Image();
  const ready = new Promise(res => { img.onload = () => res(true); img.onerror = () => res(false); });
  img.src = p.url;
  preloaded.set(p.name, ready);
  return ready;
}

function applySettings() {
  const tag = settings.hashtag.startsWith("#") ? settings.hashtag : "#" + settings.hashtag;
  $("title").textContent = $("emptyTitle").textContent = settings.title;
  $("tag").textContent = $("emptyTag").textContent = tag;
  document.body.classList.toggle("no-banner", !settings.showBanner);
  document.title = settings.title + " – Photo Wall";
}

async function fetchSettings() {
  try { settings = await (await fetch("/api/settings")).json(); applySettings(); } catch (e) {}
}

async function fetchPhotos() {
  try {
    const data = await (await fetch("/api/photos")).json();
    if (data.version === version) return;
    const known = new Set(photos.map(p => p.name));
    const firstLoad = version === "";
    version = data.version;
    photos = data.photos;
    const names = new Set(photos.map(p => p.name));
    priority = priority.filter(n => names.has(n));
    if (!firstLoad && settings.newestFirst) {
      photos.filter(p => !known.has(p.name)).forEach(p => { priority.push(p.name); preload(p); });
    }
    $("empty").style.display = photos.length ? "none" : "flex";
    if (photos.length && !current) next();
    if (!photos.length && current) { current.remove(); current = null; clearTimeout(timer); }
    if (current && !names.has(current.dataset.name)) next();   // the photo on screen was removed
  } catch (e) {}
}

function pickNext() {
  while (priority.length) {
    const name = priority.shift();
    const i = photos.findIndex(p => p.name === name);
    if (i >= 0) return i;
  }
  if (current) {
    const i = photos.findIndex(p => p.name === current.dataset.name);
    if (i >= 0) index = i;
  }
  return (index + 1) % photos.length;
}

async function next() {
  clearTimeout(timer);
  if (!photos.length) return;
  index = pickNext();
  const p = photos[index];
  await preload(p);
  preload(photos[(index + 1) % photos.length]);

  const slide = document.createElement("div");
  slide.className = "slide";
  slide.dataset.name = p.name;
  slide.style.setProperty("--dur", (settings.interval + 2) + "s");
  let caption = "";
  if (settings.showCaptions) {
    const who = p.username ? `<b>@${esc(p.username)}</b> ` : "";
    const text = (p.caption || "").replace(/\s+/g, " ").trim();
    caption = who + esc(text.length > 160 ? text.slice(0, 157) + "…" : text);
  }
  slide.innerHTML = `<div class="bg"></div><img alt=""><div class="caption">${caption.trim()}</div>`;
  slide.querySelector(".bg").style.backgroundImage = `url("${p.url}")`;
  slide.querySelector("img").src = p.url;
  $("stage").appendChild(slide);
  requestAnimationFrame(() => requestAnimationFrame(() => slide.classList.add("show")));
  const old = current;
  current = slide;
  if (old) { old.classList.remove("show"); setTimeout(() => old.remove(), 1400); }
  $("counter").textContent = `${index + 1} / ${photos.length}`;
  timer = setTimeout(next, settings.interval * 1000);
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
$("fsBtn").onclick = toggleFullscreen;
document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

let idleTimer;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
});

(async () => {
  await fetchSettings();
  await fetchPhotos();
  setInterval(fetchPhotos, 3000);
  setInterval(fetchSettings, 5000);
})();
</script>
</body>
</html>

          <div class="hint hidden" id="cCode">SEND IT FROM MEMORY</div>
        </div>
      </div>
      <div class="phrase" id="cCells"></div>
      <div class="fb" id="cFb"></div>`;
    $('#cExit', this.el).onclick = () => { Transmitter.stop(); this.renderReady(); };
    if (decodeMode) {
      const ans = $('#cAns', this.el);
      ans.addEventListener('input', () => { const v = ans.value.toUpperCase(); ans.value = ''; if (v) this.answer(v); });
      $('#cPlay', this.el).onclick = () => { const it = this.items[this.idx]; if (it) Transmitter.play(it.c); };
      $('#cReveal', this.el).onclick = () => { const it = this.items[this.idx]; if (!it) return; this.hints++; this.mistakes++; UI.toast(`It was ${it.c}`); this.answer(it.c, true); };
    } else {
      $('#cHint', this.el).onclick = () => {
        const it = this.items[this.idx]; if (!it) return; this.hints++;
        $('#cCode').className = 'hint'; $('#cCode').textContent = `${it.c} = ${glyph(it.code)}`;
        Tree.setTarget(it.code);
      };
    }
    this.update();
  },
  update() {
    const it = this.items[this.idx], d = this.def;
    const total = this.items.filter(i => i.code).length, done = this.items.slice(0, this.idx).filter(i => i.code).length;
    $('#cProg').textContent = `${esc(d.title || 'SECRET').toUpperCase().slice(0, 18)} · ${Math.min(done + 1, total)}/${total}`;
    $('#cCells').innerHTML = phraseCells(this.items, this.idx, d.type === 'decode');
    const cur = $('#cCells .cur'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (!it) return;
    if (d.type === 'decode') {
      $('#cCode').textContent = glyph(it.code);
    } else {
      $('#cTgt').textContent = it.c;
      const c = $('#cCode'); c.className = 'hint hidden'; c.textContent = 'SEND IT FROM MEMORY';
      Tree.setTarget(null);
    }
  },
  advance() {
    this.idx = nextPlayable(this.items, this.idx + 1);
    if (this.idx < 0) { this.finish(); return; }
    this.update();
  },
  /** Decode challenge: typed answer. */
  answer(v, revealed) {
    const it = this.items[this.idx]; if (!it) return;
    const fb = $('#cFb');
    if (v === it.c) {
      if (!revealed) { Sound.success(); Haptics.success(); UI.fx('ok'); }
      fb.className = 'fb grow ok'; fb.textContent = `✓ ${it.c}`;
      this.advance();
    } else {
      this.mistakes++; Sound.error(); Haptics.error(); UI.fx('bad');
      fb.className = 'fb grow bad'; fb.textContent = `Not ${v}`;
    }
  },
  /** Transmit challenge: keyed letter. In decode challenges the key is free play (neutral). */
  onLetter(seq, ch) {
    if (this.state !== 'run' || this.def.type !== 'transmit') return null;
    const it = this.items[this.idx], fb = $('#cFb');
    if (seq === it.code) {
      Sound.success(); Haptics.success(); UI.fx('ok');
      fb.className = 'fb ok'; fb.textContent = `✓ ${it.c}`;
      this.advance();
      return true;
    }
    this.mistakes++; Sound.error(); Haptics.error(); UI.fx('bad');
    fb.className = 'fb bad'; fb.textContent = ch ? `That was ${ch}. Try again.` : `Unknown pattern. Try again.`;
    return false;
  },
  finish() {
    this.state = 'done'; Tree.setTarget(null);
    const ms = now() - this.t0, d = this.def;
    Sound.fanfare(); Haptics.success(); UI.fx('ok');
    this.el.innerHTML = `
      <div class="row between">
        <div class="grow" style="min-width:0">
          <div class="done-title">CHALLENGE COMPLETE</div>
          <div class="fb" style="margin-top:6px;font-family:var(--mono);color:var(--text)">${esc(d.phrase.toUpperCase())}</div>
          <div class="fb">${fmtClock(ms)} · ${this.mistakes} mistake${this.mistakes === 1 ? '' : 's'}${this.hints ? ` · ${this.hints} hint${this.hints === 1 ? '' : 's'}` : ''}</div>
        </div>
        <button class="mini primary" id="cAgain">${ICON.restart}AGAIN</button>
      </div>
      ${d.reward ? `<div class="reward">${esc(d.reward)}</div>` : ''}`;
    $('#cAgain', this.el).onclick = () => this.renderReady();
  },
  load(def, quiet) {
    this.def = { title: (def.title || '').slice(0, 60), phrase: (def.phrase || '').slice(0, 200), type: def.type === 'decode' ? 'decode' : 'transmit', reward: (def.reward || '').slice(0, 400) };
    this.state = 'ready';
    if (Modes.current === this) this.renderReady();
    if (!quiet) UI.toast('Challenge loaded');
  },
  shareUrl(def) {
    const payload = b64e(JSON.stringify({ t: def.title, p: def.phrase, y: def.type, r: def.reward }));
    return location.href.split('#')[0] + '#c=' + payload;
  },

  /** Setup sheet: create / edit / share / saved list. */
  openEditor(def, jumpToSaved) {
    const d = def || { title: '', phrase: '', type: 'transmit', reward: '' };
    const saved = Store.get('challenges', []);
    UI.openSheet('CHALLENGE SETUP', `
      <div class="group">
        <h3>SECRET PHRASE</h3>

        </div>

      syncType();

        const ok = await copyText(url);

      const renderSaved = () => {

          : '<p class="help">No saved challenges yet.</p>';
        $$('[data-load]', body).forEach(b => b.onclick = () => { this.load(list[+b.dataset.load], true); UI.closeSheet(); UI.toast('Challenge loaded'); });
        $$('[data-del]', body).forEach(b => b.onclick = () => { list.splice(+b.dataset.del, 1); Store.set('challenges', list); renderSaved(); });
      };
      renderSaved();
      if (jumpToSaved) setTimeout(() => $('#ceSavedGroup', body).scrollIntoView({ behavior: 'smooth' }), 300);
      void saved;
    });
  }
};

/* ----- LISTEN (microphone receiver) -----
   Pipeline: mic → ScriptProcessor → Hann-windowed Goertzel filter at the
   tone pitch every ~8 ms → adaptive noise floor / threshold with hysteresis
   → mark & gap durations (timed by sample count, so jitter-free) →
   adaptive dot/dash + letter/word gap classification → Input + Tree.
   An AnalyserNode FFT finds the strongest steady tone (auto pitch). */
const median = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
const GAP_MULT = { tight: 0.8, normal: 1, loose: 1.45 };

const Listener = {
  active: false, starting: false,
  ctx: null, stream: null, src: null, proc: null, analyser: null, sink: null,
  fs: 48000, N: 384, f0: 640, coeff: 0, win: null, buf: null, bufPos: 0, clock: 0,
  HIST: 480, hLevel: null, hThr: null, hOn: null, hIdx: 0,

  reset() {
    Object.assign(this, {
      floorDb: null, peakDb: null, on: false, onCount: 0, offCount: 0, streakStart: 0, offStart: 0,
      markStart: 0, lastMarkEnd: 0, gapState: 'idle', marks: [], gaps: [], pending: [],
      unit: 100, dashThr: 200, tuneCand: 0, tuneStable: 0, procCalls: 0, lastPreview: null,
      levelDb: -120, thrDb: -120, ratio: 0,
    });
    this.hLevel = new Float32Array(this.HIST).fill(-120);
    this.hThr = new Float32Array(this.HIST).fill(-120);
    this.hOn = new Uint8Array(this.HIST);
    this.hIdx = 0;
  },

  setFreq(f) {
    this.f0 = clamp(f, 250, 2000);
    this.coeff = 2 * Math.cos(2 * Math.PI * this.f0 / this.fs);
    this.updateMeta();
  },

  async start() {
    if (this.active || this.starting) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.status(window.isSecureContext ? 'MIC NOT SUPPORTED' : 'NEEDS HTTPS', 'bad');
      UI.toast(window.isSecureContext ? 'This browser can\'t use the microphone' : 'Open the https:// link to use the microphone');
      return;
    }
    const ctx = Sound.init();
    if (!ctx) { this.status('NO AUDIO SUPPORT', 'bad'); return; }
    this.starting = true;
    this.status('ASKING FOR MIC…');
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
      });
    } catch (e) {
      this.starting = false;
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      this.status(denied ? 'MIC BLOCKED' : 'NO MICROPHONE', 'bad');
      UI.toast(denied ? 'Microphone blocked — allow it in your browser settings for this site' : 'No microphone found', 3200);
      return;
    }
    if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
    this.ctx = ctx;
    this.fs = ctx.sampleRate;
    this.N = Math.round(this.fs * 0.008);             // ~8 ms analysis blocks
    this.win = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (this.N - 1));
    this.buf = new Float32Array(this.N); this.bufPos = 0; this.clock = 0;
    this.reset();
    this.setFreq(settings.toneHz);

    this.src = ctx.createMediaStreamSource(this.stream);
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 4096; this.analyser.smoothingTimeConstant = 0;
    this.fftData = new Float32Array(this.analyser.frequencyBinCount);
    this.proc = ctx.createScriptProcessor(1024, 1, 1);
    this.sink = ctx.createGain(); this.sink.gain.value = 0;   // processor must reach destination to run
    this.src.connect(this.analyser);
    this.src.connect(this.proc);
    this.proc.connect(this.sink); this.sink.connect(ctx.destination);
    this.proc.onaudioprocess = e => this.process(e.inputBuffer.getChannelData(0));

    this.starting = false; this.active = true;
    Input.reset();
    this.status('LISTENING', 'on');
    this.syncButton();
    this.drawLoop();
  },

  stop(reason) {
    if (this.starting) return;
    if (this.active) this.commitLetter();
    this.active = false;
    try { this.proc && (this.proc.onaudioprocess = null); } catch (e) {}
    [this.src, this.analyser, this.proc, this.sink].forEach(n => { try { n && n.disconnect(); } catch (e) {} });
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = this.src = this.proc = this.analyser = this.sink = null;
    cancelAnimationFrame(this.raf);
    Tree.setPreview(null);
    this.status(reason || 'MIC OFF');
    this.syncButton();
    const led = $('#rxLed'); if (led) led.classList.remove('tone');
  },

  /** Raw samples → fixed-size blocks. */
  process(x) {
    if (!this.active) return;
    for (let i = 0; i < x.length; i++) {
      this.buf[this.bufPos++] = x[i];
      if (this.bufPos === this.N) { this.clock += this.N; this.block(); this.bufPos = 0; }
    }
    if (++this.procCalls % 4 === 0 && settings.listenAuto) this.autoTune();
  },

  block() {
    const N = this.N, x = this.buf, w = this.win, c = this.coeff;
    let s1 = 0, s2 = 0, ms = 0;
    for (let i = 0; i < N; i++) {
      const v = x[i];
      ms += v * v;
      const s0 = v * w[i] + c * s1 - s2; s2 = s1; s1 = s0;
    }
    ms /= N;
    const power = s1 * s1 + s2 * s2 - c * s1 * s2;
    const amp = 2 * Math.sqrt(Math.max(power, 0)) / (N * 0.5);   // Hann coherent gain 0.5
    const toneMs = amp * amp / 2;
    const level = 10 * Math.log10(toneMs + 1e-12);
    const ratio = ms > 1e-12 ? Math.min(1, toneMs / ms) : 0;
    const t = this.clock / this.fs * 1000;             // ms at end of this block
    const blockMs = N / this.fs * 1000;

    // Adaptive noise floor (only while silent) and signal peak (only while on).
    if (this.floorDb == null) { this.floorDb = level; this.peakDb = level + 25; }
    if (!this.on) {
      this.floorDb += (level - this.floorDb) * (level < this.floorDb ? 0.3 : 0.02);
      if (this.peakDb < this.floorDb + 15) this.peakDb = this.floorDb + 15;
    } else {
      this.peakDb += (level - this.peakDb) * (level > this.peakDb ? 0.5 : 0.05);
    }
    const thr = this.floorDb + Math.max(settings.listenSnr, (this.peakDb - this.floorDb) * 0.45);
    this.levelDb = level; this.thrDb = thr; this.ratio = ratio;

    // Hysteresis + 2-block debounce.
    if (!this.on) {
      if (level > thr && ratio > 0.2) {
        if (++this.onCount === 1) this.streakStart = t - blockMs;
        if (this.onCount >= 2) { this.on = true; this.offCount = 0; this.markBegin(this.streakStart); }
      } else this.onCount = 0;
    } else {
      if (level < thr - 3 || ratio < 0.08) {
        if (++this.offCount === 1) this.offStart = t - blockMs;
        if (this.offCount >= 2) { this.on = false; this.onCount = 0; this.markEnd(this.offStart); }
      } else this.offCount = 0;
    }

    if (this.on) {
      // Live preview of where this mark will land in the tree.
      const p = Input.seq + ((t - this.markStart) >= this.dashThr ? '-' : '.');
      if (p !== this.lastPreview) { this.lastPreview = p; Tree.setPreview(p); }
    } else if (this.gapState !== 'idle') {
      const silence = t - this.lastMarkEnd;
      const { letter, word } = this.gapThresholds();
      if (this.gapState === 'intra' && silence > letter) {
        this.gapState = 'letter';
        this.commitLetter();
      }
      if (this.gapState === 'letter' && silence > word) {
        this.gapState = 'idle';
        Modes.current.onWordSpace && Modes.current.onWordSpace('auto');
      }
    }

    const k = this.hIdx = (this.hIdx + 1) % this.HIST;
    this.hLevel[k] = level; this.hThr[k] = thr; this.hOn[k] = this.on ? 1 : 0;
  },

  markBegin(t) {
    if ((this.gapState === 'intra' || this.gapState === 'letter') && this.lastMarkEnd) {
      const gap = t - this.lastMarkEnd;
      if (gap < 4000) { this.gaps.push(gap); if (this.gaps.length > 20) this.gaps.shift(); }
    }
    this.markStart = t;
    Input.holdTimers();
    const led = $('#rxLed'); if (led) led.classList.add('tone');
  },

  markEnd(t) {
    const dur = t - this.markStart;
    Tree.setPreview(null); this.lastPreview = null;
    const led = $('#rxLed'); if (led) led.classList.remove('tone');
    if (dur < 20) return;                                        // click / glitch
    const sym = dur < this.dashThr ? '.' : '-';
    this.marks.push(dur); if (this.marks.length > 16) this.marks.shift();
    this.adapt(sym, dur);
    this.lastMarkEnd = t;
    this.gapState = 'intra';
    this.pending.push(dur);
    Input.addSymbol(sym, 'mic', { external: true });
    if (Input.seq.length >= 6) { this.commitLetter(); this.gapState = 'letter'; }
    this.updateMeta();
  },

  /** Learn the sender's speed: split recent marks into short/long clusters. */
  adapt(sym, dur) {
    const m = this.marks;
    let best = null;
    if (m.length >= 3) {
      const s = [...m].sort((a, b) => a - b), L = s.map(Math.log);
      for (let k = 1; k < s.length; k++) {
        const a = s.slice(0, k), b = s.slice(k);
        const ma = avg(a), mb = avg(b);
        if (mb / ma < 1.8) continue;
        const la = L.slice(0, k), lb = L.slice(k), mla = avg(la), mlb = avg(lb);
        const cost = la.reduce((q, v) => q + (v - mla) ** 2, 0) + lb.reduce((q, v) => q + (v - mlb) ** 2, 0);
        if (!best || cost < best.cost) best = { cost, ma, mb };
      }
    }
    if (best) {
      this.unit = (best.ma + best.mb / 3) / 2;
      this.dashThr = clamp((best.ma + best.mb) / 2, best.ma * 1.35, best.mb * 0.85);
    } else if (sym === '.') {
      this.unit += (dur - this.unit) * (m.length <= 2 ? 0.8 : 0.4);
      this.dashThr = this.unit * 2.2;
    } else {
      this.unit += (dur / 3 - this.unit) * (m.length <= 2 ? 0.8 : 0.4);
      this.dashThr = Math.min(this.dashThr, dur * 0.66);
    }
    this.unit = clamp(this.unit, 25, 500);
    this.dashThr = clamp(this.dashThr, 50, 1500);
  },

  /** Split values into short/long clusters (log scale). Returns {ma, mb} or null if not bimodal. */
  twoMeans(vals, minRatio) {
    if (vals.length < 3) return null;
    const s = [...vals].sort((a, b) => a - b), L = s.map(Math.log);
    let best = null;
    for (let k = 1; k < s.length; k++) {
      const ma = avg(s.slice(0, k)), mb = avg(s.slice(k));
      if (mb / ma < minRatio) continue;
      const la = L.slice(0, k), lb = L.slice(k), mla = avg(la), mlb = avg(lb);
      const cost = la.reduce((q, v) => q + (v - mla) ** 2, 0) + lb.reduce((q, v) => q + (v - mlb) ** 2, 0);
      if (!best || cost < best.cost) best = { cost, ma, mb };
    }
    return best;
  },

  /** Letter / word gap thresholds learned from the sender's actual pauses. */
  gapThresholds() {
    const mult = GAP_MULT[settings.listenGap] || 1;
    const c = this.twoMeans(this.gaps, 2);
    let letter, word;
    if (c) {
      letter = clamp(Math.sqrt(c.ma * c.mb), c.ma * 1.5, c.mb * 0.75);
      word = Math.max(letter * 1.9, c.mb * 1.55, 5 * this.unit);
    } else {
      const g = median(this.gaps);
      letter = Math.max(2.8 * this.unit, g ? g * 1.7 : 0);
      word = Math.max(6 * this.unit, letter * 2.2);
    }
    return { letter: Math.max(90, letter * mult), word: word * mult };
  },

  /** Re-check the letter's marks against the latest speed estimate, then commit. */
  commitLetter() {
    if (this.pending.length && this.pending.length === Input.seq.length) {
      const seq = this.pending.map(d => d < this.dashThr ? '.' : '-').join('');
      if (seq !== Input.seq) { Input.seq = seq; Tree.setPath(seq); UI.updateSeq(); }
    }
    this.pending = [];
    if (Input.seq) Input.commit('mic');
  },

  /** Find the dominant steady tone between 300 and 1500 Hz and retune to it. */
  autoTune() {
    if (!this.analyser) return;
    const d = this.fftData; this.analyser.getFloatFrequencyData(d);
    const hz = this.fs / this.analyser.fftSize;
    const lo = Math.floor(300 / hz), hi = Math.ceil(1500 / hz);
    let mx = -Infinity, mi = lo; const band = [];
    for (let i = lo; i <= hi; i++) { band.push(d[i]); if (d[i] > mx) { mx = d[i]; mi = i; } }
    const prom = mx - median(band);
    if (!(prom > 25) || mx < -85) { this.tuneStable = 0; return; }
    const a = d[mi - 1], b = d[mi], c = d[mi + 1];
    const off = (a - c) / (2 * (a - 2 * b + c)) || 0;
    const f = (mi + clamp(off, -0.5, 0.5)) * hz;
    if (Math.abs(f - this.tuneCand) < 25) this.tuneStable++; else { this.tuneStable = 0; this.tuneCand = f; }
    if (this.tuneStable >= 2 && Math.abs(f - this.f0) > 30) { this.setFreq(f); this.tuneStable = 0; }
  },

  /* ----- UI ----- */
  status(text, kind) {
    const s = $('#rxStatus'); if (!s) return;
    s.textContent = text; s.className = 'lab' + (kind ? ' ' + kind : '');
    const led = $('#rxLed'); if (led) led.classList.toggle('live', kind === 'on');
  },
  syncButton() {
    const b = $('#rxBtn'); if (!b) return;
    b.innerHTML = this.active ? `${ICON.stop}STOP LISTENING` : `${ICON.mic}START LISTENING`;
    b.classList.toggle('primary', !this.active);
  },
  updateMeta() {
    const f = $('#rxFreq'); if (!f) return;
    f.textContent = Math.round(this.f0) + ' Hz';
    $('#rxWpm').textContent = this.marks && this.marks.length ? Math.round(1200 / this.unit) + ' WPM' : '— WPM';
  },
  drawLoop() {
    const cv = $('#rxCanvas'); if (!cv) return;
    const g = cv.getContext('2d');
    const draw = () => {
      if (!this.active) return;
      const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      const lo = (this.floorDb ?? -100) - 8, hi = Math.max((this.peakDb ?? -40) + 6, lo + 30);
      const y = v => H - clamp((v - lo) / (hi - lo), 0, 1) * (H - 4) - 2;
      const n = this.HIST, dx = W / (n - 1);
      // tone-on bands
      g.fillStyle = 'rgba(56,232,255,.12)';
      for (let i = 0; i < n; i++) { const k = (this.hIdx + 1 + i) % n; if (this.hOn[k]) g.fillRect(i * dx, 0, dx + 0.6, H); }
      // threshold
      g.strokeStyle = 'rgba(255,179,64,.75)'; g.setLineDash([4, 4]); g.lineWidth = 1;
      g.beginPath(); for (let i = 0; i < n; i++) { const k = (this.hIdx + 1 + i) % n; const yy = y(this.hThr[k]); i ? g.lineTo(i * dx, yy) : g.moveTo(0, yy); } g.stroke();
      g.setLineDash([]);
      // level trace
      g.strokeStyle = '#38e8ff'; g.lineWidth = 1.6; g.shadowColor = '#38e8ff'; g.shadowBlur = 6;
      g.beginPath(); for (let i = 0; i < n; i++) { const k = (this.hIdx + 1 + i) % n; const yy = y(this.hLevel[k]); i ? g.lineTo(i * dx, yy) : g.moveTo(0, yy); } g.stroke();
      g.shadowBlur = 0;
      const snr = $('#rxSnr'); if (snr && this.floorDb != null) snr.textContent = Math.max(0, Math.round(this.levelDb - this.floorDb)) + ' dB';
      this.raf = requestAnimationFrame(draw);
    };
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(draw);
  },
  bindUI() {
    $('#rxBtn').onclick = () => this.active ? this.stop() : this.start();
    const auto = $('#rxAuto');
    const syncAuto = () => auto.classList.toggle('sel', !!settings.listenAuto);
    auto.onclick = () => { settings.listenAuto = !settings.listenAuto; saveSettings(); syncAuto(); if (!settings.listenAuto && this.active) this.setFreq(settings.toneHz); UI.toast(settings.listenAuto ? 'Auto pitch on' : `Pitch fixed at ${settings.toneHz} Hz`); };
    syncAuto();
    const syncGap = () => $$('#rxGap .chip').forEach(c => c.classList.toggle('sel', c.dataset.g === settings.listenGap));
    $$('#rxGap .chip').forEach(c => c.onclick = () => { settings.listenGap = c.dataset.g; saveSettings(); syncGap(); });
    syncGap();
    this.syncButton(); this.updateMeta();
    if (!this.active) this.status('MIC OFF');
  }
};

const Listen = makeMessageMode('listen', 'LISTEN', {
  big: true, noPlay: true, title: 'RECEIVED',
  placeholder: 'Tap START LISTENING, then send Morse from another phone held nearby. Letters appear here live.'
});
Object.assign(Listen, {
  autoSpace: false, noKey: true,
  baseEnter: Listen.enter, baseLetter: Listen.onLetter,
  enter(el) { this.baseEnter(el); Listener.bindUI(); },
  exit() { Listener.stop(); },
  onLetter(seq, ch) {
    if (!ch) { this.message += '*'; this.save(); this.render(); return false; }   // * = unreadable letter
    return this.baseLetter(seq, ch);
  }
});

/* ----- Mode registry ----- */
const Modes = {
  list: { explore: Explore, learn: Learn, speed: Speed, decode: Decode, listen: Listen, practice: Practice, challenge: Challenge },
  order: ['explore', 'learn', 'speed', 'decode', 'listen', 'practice', 'challenge'],
  current: null,
  set(id) {
    if (!this.list[id]) id = 'explore';
    if (this.current) { try { this.current.exit && this.current.exit(); } catch (e) { console.error(e); } }
    Transmitter.stop();
    Input.reset();
    Tree.setTarget(null);
    this.current = this.list[id];
    document.body.dataset.mode = id;
    UI.els.modeName.textContent = this.current.label + ' MODE';
    $$('#tabs .tab').forEach(t => { const a = t.dataset.mode === id; t.classList.toggle('active', a); t.setAttribute('aria-selected', a); if (a) t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
    const scr = UI.els.screen;
    scr.innerHTML = '';
    this.current.enter(scr);
    Store.set('mode', id);
    Bus.emit('mode', { id });
  }
};

  document.body.classList.toggle('adv', settings.level === 'advanced');
  Sound.applySettings();
  Tree.applyLayout();
  const sb = $('#btnSound'); sb.innerHTML = settings.sound ? ICON.soundOn : ICON.soundOff; sb.classList.toggle('lit', settings.sound); sb.classList.toggle('off', !settings.sound);
  const hb = $('#btnHaptic'); hb.innerHTML = ICON.haptic; hb.classList.toggle('lit', settings.haptics); hb.classList.toggle('off', !settings.haptics);
  UI.els.padsub.textContent = `TAP < ${settings.threshold}ms = •  ·  HOLD = —`;
  // Re-render prompts whose hints depend on level
  const m = Modes.current;
  if (m === Learn && Learn.target) Learn.renderHint();
  if (m === Practice && Practice.state === 'run') Practice.update();
  if (m === Speed && Speed.state === 'run') { const b = settings.level === 'beginner'; Tree.setTarget(b ? MORSE[Speed.target] : null); }

}

function rangeField(key, label, min, max, step, unit, help) {
  return `<div class="field">
    <div class="row"><label class="flabel" for="r_${key}">${label}</label><span class="val" id="v_${key}">${settings[key]}${unit}</span></div>
    <input type="range" id="r_${key}" data-key="${key}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${settings[key]}">
    ${help ? `<p>${help}</p>` : ''}</div>`;
}
function switchField(key, label, help) {
  return `<div class="field"><div class="row"><span class="flabel">${label}</span>
    <button class="sw" role="switch" data-sw="${key}" aria-checked="${!!settings[key]}" aria-label="${label}"></button></div>${help ? `<p>${help}</p>` : ''}</div>`;
}
function paintRange(r) { const p = (r.value - r.min) / (r.max - r.min) * 100; r.style.setProperty('--p', p + '%'); }

function openSettings() {

      ${switchField('autoSpace', 'Automatic word spaces')}
      <button class="btnwide primary" id="stCal">CALIBRATE MY TIMING</button>
    </div>
    <div class="group"><h3>TRAINING LEVEL</h3>

        <div class="seg" id="stLevel"><button data-v="beginner">BEGINNER</button><button data-v="advanced">ADVANCED</button></div>
        <p>Beginner shows Morse hints, branch labels and the target route. Advanced hides letters you haven't reached so you work from memory.</p></div>
      ${switchField('showNumbers', 'Show numbers layer (0–9) in tree')}

    </div>
    <div class="group"><h3>LISTEN MODE</h3>
      ${rangeField('listenSnr', 'Listen sensitivity threshold', 4, 24, 1, ' dB', 'Lower = picks up quieter tones (but more false beeps in noisy rooms). Higher = ignores more background noise.')}
      ${switchField('listenAuto', 'Auto-detect sender pitch', `When off, listens only at the Tone pitch above (${settings.toneHz} Hz).`)}
    </div>
    <div class="group"><h3>HOW TO USE</h3>
      <div class="field help">
        <b>Tap</b> the pad for a dot, <b>hold</b> it for a dash. Pause and the letter is decoded. Watch your route light up through the tree: dots branch <b>left</b>, dashes branch <b>right</b>.<br><br>
        <b>Keyboard:</b> <kbd>Space</kbd> is the key, <kbd>.</kbd> / <kbd>-</kbd> add symbols, <kbd>Enter</kbd> commits, <kbd>/</kbd> word space, <kbd>⌫</kbd> backspace, <kbd>Esc</kbd> clears.<br><br>
        <b>Hold CLR</b> to wipe the whole message.<br><br>
        <b>Listen:</b> set the other phone's volume up, hold it a few inches from this phone's microphone, and send. Works best in a quiet room.<br><br>
        <b>Install:</b> iPhone — Share → <i>Add to Home Screen</i>. Android — menu → <i>Install app</i>.
      </div>
    </div>
    <div class="group"><h3>DATA</h3>
      <div class="field help">Learn best streak: <b>${Stats.learnBestStreak}</b> · Letters practised: <b>${Stats.learnTotal}</b><br>
      Speed bests: ${[30, 60, 120].map(d => `${d}s <b>${Stats.speedBest[d] ? Stats.speedBest[d].correct : '—'}</b>`).join(' · ')}</div>
      <button class="btnwide danger" id="stReset">RESET SCORES</button>
      <button class="btnwide" id="stDefaults">RESTORE DEFAULT SETTINGS</button>
    </div>`, body => {
    $$('input[type=range]', body).forEach(r => {
      paintRange(r);
      r.addEventListener('input', () => {
        const k = r.dataset.key; let v = +r.value;
        settings[k] = v;
        if (k === 'letterPause' && settings.wordPause < v + 300) { settings.wordPause = Math.ceil((v + 300) / 100) * 100; const w = $('#r_wordPause', body); w.value = settings.wordPause; paintRange(w); $('#v_wordPause', body).textContent = settings.wordPause + 'ms'; }
        if (k === 'wordPause' && v < settings.letterPause + 300) { v = settings.wordPause = Math.ceil((settings.letterPause + 300) / 100) * 100; r.value = v; }
        $('#v_' + k, body).textContent = (k === 'volume' ? Math.round(v * 100) + '%' : v + r.dataset.unit);
        paintRange(r);
        saveSettings();
      });
      if (r.dataset.key === 'volume') $('#v_volume', body).textContent = Math.round(settings.volume * 100) + '%';
      if (r.dataset.key === 'toneHz' || r.dataset.key === 'volume') r.addEventListener('change', () => Sound.symbol('.'));
    });
    $$('[data-sw]', body).forEach(b => b.onclick = () => {
      const k = b.dataset.sw; settings[k] = !settings[k]; b.setAttribute('aria-checked', settings[k]); saveSettings();
      if (k === 'haptics' && settings.haptics) Haptics.light();
      if (k === 'sound' && settings.sound) Sound.success();
    });
    const syncLevel = () => $$('#stLevel button', body).forEach(b => b.classList.toggle('sel', b.dataset.v === settings.level));
    $$('#stLevel button', body).forEach(b => b.onclick = () => { settings.level = b.dataset.v; syncLevel(); saveSettings(); });
    syncLevel();
    $('#stCal', body).onclick = () => Calibrate.open();
    let armed = false;
    $('#stReset', body).onclick = e => {
      if (!armed) { armed = true; e.target.textContent = 'TAP AGAIN TO CONFIRM'; setTimeout(() => { armed = false; e.target.textContent = 'RESET SCORES'; }, 2500); return; }
      Object.assign(Stats, { learnBestStreak: 0, learnTotal: 0, speedBest: {}, letters: {}, presses: { dot: [], dash: [] } }); Stats.save();
      e.target.textContent = 'SCORES RESET'; UI.toast('Scores reset');
    };
    $('#stDefaults', body).onclick = () => { Object.assign(settings, DEFAULTS); saveSettings(); openSettings(); UI.toast('Defaults restored'); };
  });
}

/** Calibration: 5 quick taps + 5 long holds → midpoint threshold. */
const Calibrate = {
  open() {
    const taps = [], holds = [];
    UI.openSheet('CALIBRATE', `
      <div class="calstep" id="calStep">Tap quickly 5 times</div>
      <div class="calnote" id="calNote">Use the same quick tap you'd use for a dot.</div>
      <div class="pips" id="calPips">${'<i></i>'.repeat(10)}</div>
      <section class="pad calpad" id="calPad"><span class="ms" id="calMs">0 ms</span><div class="core"><b>•</b></div><div class="padlabel">CALIBRATION PAD</div></section>
      <div id="calResult"></div>`, body => {
      const pad = $('#calPad', body); let t0 = 0, raf = 0, done = false;
      const paint = () => $$('#calPips i', body).forEach((p, i) => { p.className = i < taps.length ? 'f' : (i - 5 < holds.length && i >= 5 ? 'f h' : ''); });
      bindPress(pad, () => {
        if (done) return;
        t0 = now(); pad.classList.add('down'); Sound.toneOn();
        const tick = () => { $('#calMs', body).textContent = Math.round(now() - t0) + ' ms'; raf = requestAnimationFrame(tick); }; tick();
      }, () => {
        if (done || !t0) return;
        const ms = now() - t0; t0 = 0; cancelAnimationFrame(raf); pad.classList.remove('down'); Sound.toneOff(); Sound.init();
        if (taps.length < 5) {
          taps.push(ms); Haptics.symbol('.');
          if (taps.length === 5) { $('#calStep', body).textContent = 'Now hold 5 times'; $('#calNote', body).textContent = 'Hold each press like a comfortable dash.'; }
        } else if (holds.length < 5) {
          holds.push(ms); Haptics.symbol('-');
        }
        paint();
        if (holds.length === 5) finish();
      }, () => { t0 = 0; cancelAnimationFrame(raf); pad.classList.remove('down'); Sound.toneOff(); });
      const finish = () => {
        done = true;
        const at = avg(taps), ah = avg(holds);
        if (ah <= at * 1.3) {
          $('#calStep', body).textContent = 'Those were too similar';
          $('#calNote', body).textContent = 'Make taps snappy and holds clearly longer, then try again.';
          $('#calResult', body).innerHTML = '<button class="btnwide primary" id="calRetry">TRY AGAIN</button>';
          $('#calRetry', body).onclick = () => Calibrate.open();
          return;
        }
        // Midpoint between the slowest tap and the quickest hold, blended with the means.
        const mid = (Math.max(...taps) + Math.min(...holds)) / 2 * 0.5 + (at + ah) / 2 * 0.5;
        const th = clamp(Math.round(mid / 10) * 10, 100, 600);
        $('#calStep', body).textContent = `Suggested threshold: ${th} ms`;
        $('#calNote', body).textContent = `Your taps averaged ${Math.round(at)} ms, holds ${Math.round(ah)} ms.`;
        $('#calResult', body).innerHTML = `<button class="btnwide primary" id="calApply">APPLY ${th} MS</button><button class="btnwide" id="calRetry">REDO</button>`;
        $('#calApply', body).onclick = () => { settings.threshold = th; saveSettings(); Sound.success(); Haptics.success(); UI.closeSheet(); UI.toast(`Threshold set to ${th} ms`); };
        $('#calRetry', body).onclick = () => Calibrate.open();
      };
    });
  }
};

/* Clipboard helper with fallback for older Safari / non-secure contexts. */
async function copyText(text) {
  if (!text) return false;
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;-webkit-user-select:text;user-select:text';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

/* =====================================================================
   12. WIRING / BOOT
   ===================================================================== */
function isTyping(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); }

/** Briefly animate a key button when triggered from the keyboard. */
function flashKey(id) { const k = $(id); k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 90); }

function addButtonSymbol(sym) {
  if (Modes.current && Modes.current.noKey) return;
  Sound.symbol(sym); Haptics.symbol(sym); UI.showInterp(sym);
  Input.addSymbol(sym, 'button');
}

function boot() {
  UI.init();
  Haptics.setup();
  Tree.build();

  // Tabs
  $('#tabs').innerHTML = Modes.order.map(id => `<button class="tab" role="tab" data-mode="${id}">${Modes.list[id].label}</button>`).join('');
  $$('#tabs .tab').forEach(t => t.onclick = () => { if (Modes.current.id !== t.dataset.mode) { Sound.tick(); Modes.set(t.dataset.mode); } });

  // Main key pad
  bindPress($('#pad'), () => Keyer.down(), () => Keyer.up(), () => Keyer.cancel());

  // Key row (click is fine here: touch-action:manipulation removes the 300ms delay)
  $('#kDot').onclick = () => addButtonSymbol('.');
  $('#kDash').onclick = () => addButtonSymbol('-');
  $('#kSpace').onclick = () => { Input.wordSpace(); Haptics.light(); };
  $('#kBack').onclick = () => { Input.backspace(); Haptics.light(); };
  // CLR: tap = clear current letter; long-press (600ms) = clear entire message
  (() => {
    const k = $('#kClear'); let t = 0, long = false;
    k.addEventListener('pointerdown', () => { long = false; t = setTimeout(() => { long = true; Input.clearLetter(); Modes.current.onClearAll ? Modes.current.onClearAll() : UI.toast('Nothing to clear'); Haptics.error(); }, 600); });
    const stop = () => clearTimeout(t);
    k.addEventListener('pointerup', stop); k.addEventListener('pointercancel', stop); k.addEventListener('pointerleave', stop);
    k.addEventListener('contextmenu', e => e.preventDefault());
    k.onclick = () => { if (long) return; if (Input.seq) Input.clearLetter(); else if (Modes.current.onClearAll) UI.toast('Hold CLR to clear the message'); Haptics.light(); };
  })();

  // Header buttons
  $('#btnSound').onclick = () => { settings.sound = !settings.sound; saveSettings(); if (settings.sound) Sound.tick(1200); UI.toast(settings.sound ? 'Sound on' : 'Sound off', 900); };
  $('#btnHaptic').onclick = () => { settings.haptics = !settings.haptics; saveSettings(); if (settings.haptics) Haptics.success(); UI.toast(settings.haptics ? 'Haptics on' : 'Haptics off', 900); };
  $('#btnSettings').onclick = () => openSettings();
  $('#sheetClose').onclick = () => UI.closeSheet();
  $('#sheetBackdrop').onclick = () => UI.closeSheet();

  // Keyboard support (desktop / Bluetooth keyboards)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && UI.sheetOpen) { UI.closeSheet(); return; }
    if (isTyping(e.target) || UI.sheetOpen || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) Keyer.down(); return; }
    if (e.repeat) return;
    switch (e.key) {
      case '.': addButtonSymbol('.'); flashKey('#kDot'); break;
      case '-': case '_': addButtonSymbol('-'); flashKey('#kDash'); break;
      case 'Enter': e.preventDefault(); Input.commit('manual'); break;
      case '/': e.preventDefault(); Input.wordSpace(); flashKey('#kSpace'); break;
      case 'Backspace': e.preventDefault(); Input.backspace(); flashKey('#kBack'); break;
      case 'Escape': Input.clearLetter(); flashKey('#kClear'); break;
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' && !isTyping(e.target)) { e.preventDefault(); Keyer.up(); }
  });

  // iOS: unlock audio on the first trusted touch; block pinch-zoom gestures.
  const unlock = () => { if (settings.sound) Sound.init(); };
  document.addEventListener('touchend', unlock, { capture: true, passive: true });
  document.addEventListener('click', unlock, { capture: true });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // Never leave a tone stuck on if the app is backgrounded mid-press.
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Keyer.cancel(); Transmitter.stop(); Sound.toneOff(); if (Listener.active) Listener.stop('PAUSED — TAP START'); } });
  window.addEventListener('blur', () => { Keyer.cancel(); Sound.toneOff(); });

  applySettings();

  // Challenge link? (#c=...)
  let startMode = Store.get('mode', 'explore');
  const m = location.hash.match(/[#&]c=([A-Za-z0-9_-]+)/);
  if (m) {
    try { const o = JSON.parse(b64d(m[1])); Challenge.load({ title: o.t, phrase: o.p, type: o.y, reward: o.r }, true); startMode = 'challenge'; }
    catch (e) { console.warn('Bad challenge link', e); }
  }
  Modes.set(startMode);
  UI.updateSeq();

  if (!Stats.seenIntro) { setTimeout(() => UI.toast('Tap = dot  ·  Hold = dash  ·  Pause = letter', 3200), 500); Stats.seenIntro = true; Stats.save(); }

  // Home-screen icon generated at runtime (used if icon-180.png isn't deployed).
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 180); grd.addColorStop(0, '#0f2230'); grd.addColorStop(1, '#04080c');
    g.fillStyle = grd; g.fillRect(0, 0, 180, 180);
    g.shadowColor = '#38e8ff'; g.shadowBlur = 24; g.fillStyle = '#38e8ff';
    g.beginPath(); g.arc(58, 90, 18, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.roundRect ? g.roundRect(92, 76, 52, 28, 14) : g.rect(92, 76, 52, 28); g.fill();
    const link = $('#appleIcon');
    fetch('icon-180.png', { method: 'HEAD' }).then(r => { if (!r.ok) link.href = c.toDataURL('image/png'); }).catch(() => { link.href = c.toDataURL('image/png'); });
  } catch (e) {}

  // Offline support when served over http(s) with sw.js alongside.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

boot();

// Expose internals for debugging / future extensions (e.g. window.MorseApp.Bus.on('letter', ...)).
window.ListenerDbg = Listener;
window.MorseApp = { MORSE, decode, Bus, Input, Keyer, Tree, Modes, Transmitter, Sound, Haptics, settings };
</script>
</body>
